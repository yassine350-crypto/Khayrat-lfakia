<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6e1f2a">
<title>Khayrat Lfakia – Traiteur à Marrakech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fbf6ec; --paper:#fffdf8; --wine:#6e1f2a; --gold:#b08d3c; --gold-soft:#e6d6a8; --ink:#2b1a1c; --muted:#7a6a60;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ivory)}
body{
  font-family:"Jost",system-ui,sans-serif;color:var(--ink);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  min-height:100vh;display:flex;justify-content:center;
}
.card{
  width:100%;max-width:460px;margin:18px 14px;padding:34px 22px 28px;
  background:var(--paper);border:1px solid var(--gold-soft);border-radius:4px;position:relative;
  box-shadow:0 0 0 6px var(--ivory),0 0 0 7px var(--gold-soft);
}
.card::before,.card::after{
  content:"";position:absolute;top:22px;bottom:22px;width:1px;
  background:linear-gradient(var(--gold-soft),var(--gold),var(--gold-soft));
}
.card::before{left:12px}.card::after{right:12px}
header{text-align:center}
.logo{width:96px;height:96px;display:block;margin:0 auto 14px}
.ar{font-family:"Amiri",serif;color:var(--wine);font-size:2.3rem;line-height:1.3}
.ar2{font-family:"Amiri",serif;color:var(--ink);font-size:1.35rem;margin-top:2px}
h1{font-weight:600;font-size:1.05rem;letter-spacing:.14em;color:var(--wine);margin-top:4px}
.orn{display:flex;align-items:center;gap:10px;margin:16px auto 22px;max-width:220px;color:var(--gold)}
.orn i{flex:1;height:1px;background:var(--gold)}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
.person{
  border:1px solid var(--gold-soft);border-radius:6px;padding:14px 14px 12px;margin-bottom:12px;background:#fff;
}
.person h2{font-size:.95rem;font-weight:500;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;
  min-height:50px;padding:0 14px;border-radius:6px;font-weight:600;font-size:1rem;
  border:1px solid var(--wine);color:var(--wine);background:transparent;
}
.btn svg{width:20px;height:20px;flex:none;fill:currentColor}
.btn.main{flex:1;background:var(--wine);color:#fff;letter-spacing:.03em}
.btn.wa{width:56px;padding:0}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:active{transform:scale(.98)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}
.addr{
  display:block;text-decoration:none;color:var(--ink);border-top:1px solid var(--gold-soft);
  padding-top:18px;margin-top:6px;text-align:center;
}
.addr svg{width:22px;height:22px;fill:var(--gold);margin-bottom:6px}
.addr p{font-size:.98rem;line-height:1.5}
.addr span{display:inline-block;margin-top:10px;font-weight:600;color:var(--wine);border-bottom:1px solid var(--gold)}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .12s ease}}
</style>
</head>
<body>
<main class="card">
  <header>
    <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Logo Khayrat Lfakia">
      <circle cx="48" cy="48" r="44" fill="none" stroke="#6e1f2a" stroke-width="3"/>
      <path d="M26 40h44c0 6-2 9-5 12-4 4-9 7-17 7s-13-3-17-7c-3-3-5-6-5-12z" fill="none" stroke="#b08d3c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M48 59v14" stroke="#b08d3c" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 40c0-12 10-20 24-20s24 8 24 20z" fill="none" stroke="#6e1f2a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M48 20v-6" stroke="#6e1f2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M36 46v4M48 46v6M60 46v4" stroke="#b08d3c" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <p class="ar" lang="ar" dir="rtl">خيرات الفاكية</p>
    <p class="ar2" lang="ar" dir="rtl">ممون الحفلات</p>
    <h1>TRAITEUR</h1>
    <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
  </header>

  <section class="person">

    <div class="row">
      <a class="btn main" href="tel:+212669378998">

        06 69 37 89 98

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.2.1.400 0 .5l-.4.600-.4.400c-.1.2-.3.400-.1.700.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.500.3.100.5.100.7-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>
      </a>
    </div>
  </section>

  <section class="person">
    <h2>Abdelfatah</h2>
    <div class="row">
      <a class="btn main" href="tel:+212766371139">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
        07 66 37 11 39
      </a>
      <a class="btn wa" href="https://wa.me/212766371139" aria-label="WhatsApp Abdelfatah">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.2.1.400 0 .5l-.4.600-.4.400c-.1.2-.3.400-.1.700.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.500.3.100.5.100.7-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>
      </a>
    </div>
  </section>

  <nav class="social" aria-label="Réseaux sociaux">
    <a class="btn" href="https://www.instagram.com/khayrat_lfakia">Instagram</a>
    <a class="btn" href="https://www.facebook.com/khayrat_lfakia">Facebook</a>
  </nav>

  <a class="addr" href="https://www.google.com/maps/search/?api=1&amp;query=847+Lot+Charaf+N1+Al+Manar+3+40000+Marrakech">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.800 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg>
    <p>847 Lot Charaf N1, Al Manar 3<br>40000 Marrakech</p>

</main>
</body>
</html>
